<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="gold">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lynx AI</title>
  <meta name="description" content="Lynx AI — مساعد ذكاء اصطناعي بتصميم زجاجي فاخر">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐾%3C/text%3E%3C/svg%3E">

  <script>
    // نضبط الثيم قبل رسم الصفحة حتى لا يحدث وميض
    (function () {
      try {
        var theme = localStorage.getItem('lynx.theme') ||
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.accent = localStorage.getItem('lynx.accent') || 'gold';
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- أيقونات SVG -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    </defs>
  </svg>

  <div class="orbs" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="app">

    <aside class="sidebar glass" id="sidebar" aria-label="المحادثات">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M7 6l9 7h8l9-7-2 15a13 13 0 0 1-22 0z" fill="currentColor"/>
          <circle cx="15" cy="21" r="1.8" fill="var(--bg)"/><circle cx="25" cy="21" r="1.8" fill="var(--bg)"/>
        </svg>
        <span class="brand-name">Lynx AI</span>
      </div>

      <button class="btn-primary" id="newChat" type="button">
        <svg class="icon"><use href="#i-plus"/></svg>
        محادثة جديدة
      </button>

      <nav class="chat-list" id="chatList"></nav>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="القائمة">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>

        <h1 class="chat-title" id="chatTitle">Lynx AI</h1>

        <div class="tools">
          <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الداكن والفاتح">
            <svg class="icon"><use href="#i-sun" id="themeIcon"/></svg>
          </button>
          <button class="icon-btn" id="paletteBtn" type="button" aria-label="الألوان والخطوط" aria-expanded="false">
            <svg class="icon"><use href="#i-drop"/></svg>
          </button>

          <div class="popover glass" id="palette" hidden>
            <p class="popover-label">لون الواجهة</p>
            <div class="swatches" id="swatches">
              <button type="button" class="swatch" data-accent="gold" style="--sw:#e6b85c" aria-label="ذهبي"></button>
              <button type="button" class="swatch" data-accent="violet" style="--sw:#a78bfa" aria-label="بنفسجي"></button>
              <button type="button" class="swatch" data-accent="emerald" style="--sw:#34d399" aria-label="زمردي"></button>
              <button type="button" class="swatch" data-accent="rose" style="--sw:#fb7185" aria-label="وردي"></button>
              <button type="button" class="swatch" data-accent="azure" style="--sw:#60a5fa" aria-label="أزرق"></button>
              <button type="button" class="swatch" data-accent="ember" style="--sw:#fb923c" aria-label="برتقالي"></button>
            </div>
            <label class="popover-label" for="fontSelect">الخط</label>
            <select id="fontSelect">
              <option value="tajawal">تجوال</option>
              <option value="cairo">القاهرة</option>
              <option value="amiri">أميري</option>
            </select>
          </div>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="messages-inner" id="messagesInner"></div>
      </section>

      <footer class="composer-wrap">
        <div class="attachments" id="attachments"></div>

        <form class="composer glass" id="composer" autocomplete="off">
          <button class="icon-btn" id="attachBtn" type="button" aria-label="إرفاق صورة أو ملف">
            <svg class="icon"><use href="#i-clip"/></svg>
          </button>
          <input type="file" id="fileInput" hidden multiple
                 accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.sql,.java,.c,.cpp,.cs,.go,.rs,.php,.sh">
          <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا…" aria-label="رسالتك"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="إرسال">
            <svg class="icon"><use href="#i-up" id="sendIcon"/></svg>
          </button>
        </form>

        <p class="copyright">© <span id="year">2026</span> Lynx AI — جميع الحقوق محفوظة للمطوّر لحسن (Lahcen)</p>
      </footer>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script defer src="/app.js"></script>
</body>
</html>
