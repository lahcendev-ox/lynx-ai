services:
  - type: web
    name: lynx-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # تدخله يدوياً في لوحة Render
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
    # لحفظ المحادثات بعد إعادة التشغيل تحتاج خطة مدفوعة + قرصاً دائماً.
    # فعّل الأسطر التالية وغيّر plan إلى starter:
    # disk:
    #   name: lynx-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # ثم أضف متغير البيئة:  DATA_DIR=/var/data
